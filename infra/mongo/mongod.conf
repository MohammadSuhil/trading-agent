# MongoDB for Trading Agent.
# cacheSizeGB is THE critical setting: WiredTiger defaults to
# max(0.5 x (RAM - 1GB), 256MB), which on this 48 GB machine is 23.5 GB.
# That alone would make a 22 GB model unloadable.
#
# replSetName is required (not optional): change streams, transactions and
# `mongodump --oplog` all need a replica set, even a single-node one.
storage:
  dbPath: data/mongo
  wiredTiger:
    engineConfig:
      cacheSizeGB: 2
systemLog:
  destination: file
  path: data/logs/mongod.log
  logAppend: true
net:
  bindIp: 127.0.0.1
  port: 27017
replication:
  replSetName: rs0
