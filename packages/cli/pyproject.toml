[project]
name = "ta-cli"
version = "0.1.0"
requires-python = ">=3.13,<3.15"
dependencies = ["ta-core", "ta-datafeed", "ta-quant"]

[project.scripts]
ta = "ta_cli.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ta_cli"]
