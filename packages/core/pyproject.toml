[project]
name = "ta-core"
version = "0.1.0"
description = "Pure domain core: DTOs, enums, ports, calendar, costs, PIT accessor. ZERO I/O."
requires-python = ">=3.13,<3.15"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ta_core"]
