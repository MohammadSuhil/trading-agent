[project]
name = "ta-ledger"
version = "0.1.0"
description = "Hash-chained event ledger, paper broker, risk gates, outcomes, KPIs."
requires-python = ">=3.13,<3.15"
dependencies = [
    "ta-core",
    "ta-datafeed",
    "ta-quant",
    "polars>=1.17",
    "clickhouse-connect>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ta_ledger"]
