[project]
name = "ta-datafeed"
version = "0.1.0"
description = "Market data ingestion: NSE/BSE archives, broker APIs, parsing, storage."
requires-python = ">=3.13,<3.15"
dependencies = [
    "ta-core",
    "httpx>=0.28",
    "polars>=1.17",
    # clickhouse-connect's fast path is insert_arrow, and polars.to_arrow()
    # requires pyarrow at runtime even though polars itself does not.
    "pyarrow>=18.0",
    "clickhouse-connect>=0.8",
    "pymongo>=4.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ta_datafeed"]
