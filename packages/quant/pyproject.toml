[project]
name = "ta-quant"
version = "0.1.0"
description = "Factors, screening, labelling, backtesting, statistics."
requires-python = ">=3.13,<3.15"
dependencies = ["ta-core", "ta-datafeed", "polars>=1.17", "numpy>=2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ta_quant"]
